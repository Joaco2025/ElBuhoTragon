<html lang="es-MX">

    <title>El Búho Tragón · Cafeterías de la UNISON</title>
    <script>
      // Tema guardado antes de pintar (oscuro por defecto), para que no parpadee
      try {
        if (localStorage.getItem("tema") === "claro") {
          document.documentElement.dataset.tema = "claro";
          document.querySelector('meta[name="theme-color"]').content = "#F4F6F9";
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
